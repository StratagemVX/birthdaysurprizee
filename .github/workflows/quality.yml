name: Quality & Security Checks

on:
  push:
    branches: ["main", "maintenance/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify HTML pages, JS syntax, and bundled media assets
        run: node tests/verify_site.mjs
